# All parameters are fixed a priori. Sensitivity grids are for
# sensitivity reporting only, never for choosing the headline configuration.
# Note: write floats with a decimal point and no exponent shortcut (PyYAML parses 1e-3 as a string).
# Note: dates must be quoted, otherwise YAML turns them into date objects.

run:
  seed: 42
  annualization: 252
  rf: 0.0

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  cache_dir: results/cache
  tables_dir: results/tables
  figures_dir: results/figures

data:
  start_date: "2010-01-04"   # first date with a valid price in the supplied file (from the data audit)
  end_date: "2024-12-20"     # last date with a valid price in the supplied file (from the data audit)
  ffill_limit: 3
  max_missing_frac: 0.05
  suspect_abs_logret: 0.40
  winsor_lower: 0.001
  winsor_upper: 0.999
  stocks_file: sp500_stocks.csv
  companies_file: sp500_companies.csv
  index_file: sp500_index.csv
  stocks_columns: ["Date", "Symbol", "Adj Close", "Close", "High", "Low", "Open", "Volume"]
  companies_columns: ["Symbol", "Sector", "Industry", "Marketcap", "Weight"]
  index_columns: ["Date", "S&P500"]

eda:
  stress_date: "2020-03-31"   # inside the COVID stress period (2020-02-19 to 2020-12-31)
  corr_window_days: 21
  index_vol_window_days: 21
  highlight_years: [2020, 2022]
  frontier_horizon_days: 252
  frontier_points: 50

stats:
  block_length: 10
  n_boot: 5000
  sensitivity_block_lengths: [5, 10, 20]
  references: [GMV-SAMPLE, EW, GMV-LW]
  alpha: 0.05
  mde_power: 0.8            # power of the minimum detectable effect

regimes:
  covid_start: "2020-02-19"
  covid_end: "2020-12-31"
  stress_year: 2022
  vol_window_days: 63       # S&P 500 trailing realized volatility defining the regimes
  min_history_days: 252     # observations before the expanding median is trusted

universe:
  n_assets: 100
  lookback_days: 504
  dollar_volume_window: 252

backtest:
  rebalance_days: 21
  cost_bps: 10.0
  max_weight: null
  mu_convention: arithmetic   # Markowitz expected returns: "arithmetic" (mean + var/2) or "log"

pca:
  k_rule: mp
  k_fixed: null
  baing_kmax: 10

hrp:
  linkage: single

sensitivity:
  n_assets: [50, 100, 200]
  lookback_days: [252, 504, 756]
  cost_bps: [0.0, 5.0, 10.0, 20.0]
  max_weight: [0.10]
  pca_k_fixed: [1, 3, 5, 10]
  hrp_linkage: [single, ward, average]

simulation:                  # factor-model simulation study (N=100, K_true = 1 + n_groups)
  n_assets: 100
  n_groups: 2                # disjoint asset blocks, one group factor each
  sample_sizes: [126, 252, 504, 1000]
  n_reps: 200
  distributions: [gaussian, student_t]   # first entry is the main result
  t_df: 5.0
  market_vol: 0.15
  group_vols: [0.08, 0.06]
  loading_low: 0.5
  loading_high: 1.5
  idio_vol_low: 0.15
  idio_vol_high: 0.45
  alpha: 0.05
  time_varying: false        # stochastic factor volatility and drifting loadings
  horizon_days: 21           # forward evaluation period of the time-varying design
  vol_log_sd: 0.4            # stationary sd of each factor's log volatility
  vol_persistence: 0.98      # daily autocorrelation of the log volatilities
  loading_drift_sd: 0.2      # stationary sd of the loading drift
  loading_persistence: 0.996 # daily autocorrelation of the loading drift

pipeline_check:             # synthetic-panel validation of the backtest pipeline
  n_symbols: 150            # more than universe.n_assets so the universe has to choose
  n_days: 2500
  n_panels: 4
  dv_persistence: 0.995     # AR(1) of each symbol's log dollar volume
  dv_sd: 1.0
  z2_tolerance: 3.0         # accounting check: |mean z^2 - 1| within this many standard errors
  identity_tolerance: 1.0e-6

nonstationarity:            # EWMA strategies and the simulated positive control
  halflives: [126, 63]      # fixed a priori
  calibration_block_days: 21
  sim_sample_sizes: [252, 504]
  sim_n_reps: 100

residual:                   # diagnostic and sector-block test
  n_perm: 200               # sector-label permutations per window
  sim_n_groups: 10          # positive control: weak group factors
  sim_group_vol: 0.08       # annual vol of a group factor (residual corr about 0.06)
  sim_label_error: 0.2      # share of wrong labels in the noisy-label variant
  sim_sample_sizes: [252, 504]
  sim_n_reps: 100
  n_placebo: 20             # random-label draws on the real data

forecast:                   # (covariance forecast loss on random portfolios)
  n_portfolios: 500         # random long-only portfolios per date and concentration level
  dirichlet_alphas: [1.0, 0.1]   # diffuse and concentrated
  hac_lag: 3                # Newey-West lag across rebalance dates

regularized:                # (regularized weights on the sample covariance)
  ridge_lambdas: [0.1, 1.0, 10.0]   # multiples of tr(Sigma)/N, long-only
  shrink_gammas: [0.25, 0.5, 0.75]  # weight shrinkage toward 1/N, long-only
  l1_bounds: [1.25, 1.5, 2.0]       # ||w||_1 <= c, shorting allowed
  enet_bound: 1.5                   # elastic net: L1 bound and ridge multiple together
  enet_lambda: 1.0

ml:                         # (walk-forward ML return signals); all fixed a priori
  momentum_days: 252        # 12-1 month momentum: returns over 252 days ending 21 days ago
  skip_days: 21
  reversal_days: 21         # trailing 1-month return
  vol_days: 63              # trailing volatility window
  horizon_days: 21          # label: next-21-day log return, ranked cross-sectionally
  purge_days: 21            # training labels must end at least this many rows before the cutoff
  min_train_dates: 24       # rebalance dates with labels before the first fit
  retrain_every: 6          # refit every 6 rebalance dates, expanding window
  ridge_alpha: 0.1          # penalty per training sample
  rf_trees: 200
  rf_max_depth: 4
  rf_min_leaf: 50
  rf_max_features: 0.5
  ic_gate_t: 2.0            # mean rank IC > 0 with t >= 2 needed before the optimizer uses a signal
  force_portfolio: true     # also build portfolios of models that fail the gate (shown for completeness)
