[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pfopt"
version = "0.1.0"
description = "Portfolio optimization beyond Markowitz: RMT, PCA-factor and HRP (DSE4212 project)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY", "T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
